name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: parley, POSTGRES_PASSWORD: parley, POSTGRES_DB: parley }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U parley" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Builds the real images, starts 3 servers behind nginx, and runs a small load test that
  # SIGKILLs one server partway through. Fails if any client is missing a message, has a
  # duplicate, or has one out of order.
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run cluster:up
      - run: npm run loadtest -- --channels 20 --members 10 --rate 0.5 --duration 30 --chaos --out docs/loadtest/ci-chaos.json
      - if: always()
        run: docker compose --profile cluster logs --tail 50

  # Builds the single-container image used for hosted demos and checks it end to end: web app
  # served, API under /api, demo users seeded, metrics hidden.
  single:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --wait postgres redis
      - run: docker build -f deploy/single.Dockerfile -t parley-single .
      - run: >
          docker run -d --name parley --network host
          -e DATABASE_URL=postgres://parley:parley@localhost:5433/parley
          -e REDIS_URL=redis://localhost:6380 -e SEED_DEMO=true -e PORT=3000 parley-single
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -sf localhost:3000/api/healthz && break; sleep 2; done
          curl -sf localhost:3000/ | grep -q '<div id="root">'
          curl -sf localhost:3000/workspaces/anything | grep -q '<div id="root">'
          curl -sf -X POST localhost:3000/api/auth/login -H 'content-type: application/json' \
            -d '{"username":"alice","password":"parley-demo"}' | grep -q '"token"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/metrics)" = 404
          docker exec parley sh -c 'grep -rq "alice:parley-demo" /app/public/assets' 
      - if: always()
        run: docker logs parley --tail 50
