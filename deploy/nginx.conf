worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 20000;
}

http {
  include /etc/nginx/mime.types;
  access_log off;

  # least_conn rather than round robin: WebSockets are long-lived, so balance open connections,
  # not requests. No sticky sessions are needed because the servers keep no session state.
  upstream parley {
    least_conn;
    server server1:3000 max_fails=2 fail_timeout=5s;
    server server2:3000 max_fails=2 fail_timeout=5s;
    server server3:3000 max_fails=2 fail_timeout=5s;
    keepalive 64;
  }

  # A crashed container's IP doesn't refuse connections, it times out, and the default connect
  # timeout is 60 s. With least_conn that is worse: the dead server has the fewest connections,
  # so it keeps being chosen. Fail fast and retry the next server within the same request, so a
  # reconnecting client lands on a healthy server in about a second (see docs/loadtest.md).
  proxy_connect_timeout 1s;
  proxy_next_upstream error timeout;
  proxy_next_upstream_tries 3;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;

    # Metrics are for Prometheus inside the network only.
    location = /api/metrics {
      return 404;
    }

    location /api/ {
      proxy_pass http://parley/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout http_502 http_503;  # API requests can also retry on 502/503
    }

    location = /ws {
      proxy_pass http://parley;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
